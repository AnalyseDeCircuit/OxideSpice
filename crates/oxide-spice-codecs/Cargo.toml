[package]
name = "oxide-spice-codecs"
description = "Bounded image and audio codecs used by OxideSpice"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["audio-opus", "video-h264", "video-h265", "video-vpx"]
audio-opus = ["dep:opus"]
video-h264 = ["dep:openh264"]
video-h265 = ["dep:rust_h265"]
video-vpx = ["dep:vpx-rs"]

[dependencies]
miniz_oxide.workspace = true
jpeg-decoder.workspace = true
lz4_flex.workspace = true
openh264 = { workspace = true, optional = true }
opus = { workspace = true, optional = true }
rust_h265 = { workspace = true, optional = true }
thiserror.workspace = true
vpx-rs = { workspace = true, optional = true }
zune-jpeg.workspace = true

[dev-dependencies]
jpeg-encoder = { version = "0.7.1", default-features = false, features = ["std"] }

[lints]
workspace = true
